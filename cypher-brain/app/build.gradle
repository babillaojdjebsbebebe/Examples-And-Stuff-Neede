plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cypherbrain.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cypherbrain.app'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
